<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <title>Happy Birthday Sani! 💖</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0d0814;
      --bg-surface: #171124;
      --primary: #ff3366;
      --primary-glow: rgba(255, 51, 102, 0.45);
      --accent: #ffd166;
      --accent-purple: #9b5de5;
      --text: #ffffff;
      --text-muted: #d0c7de;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: var(--bg-dark);
    }

    body {
      background: radial-gradient(circle at 50% 20%, #241432 0%, var(--bg-dark) 85%);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient Canvas */
    #ambient-canvas, #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    #confetti-canvas { z-index: 99; }

    /* Audio Pill */
    .audio-pill {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: calc(16px + env(safe-area-inset-right, 0px));
      z-index: 100;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      transition: all 0.25s ease;
    }

    .audio-pill:active {
      transform: scale(0.96);
    }

    .audio-wave {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 14px;
    }

    .audio-wave span {
      width: 3px;
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      animation: pulseWave 1s ease-in-out infinite alternate;
    }
    .audio-wave span:nth-child(2) { animation-delay: 0.2s; height: 60%; }
    .audio-wave span:nth-child(3) { animation-delay: 0.4s; height: 80%; }
    .audio-wave span:nth-child(4) { animation-delay: 0.1s; height: 40%; }

    @keyframes pulseWave {
      0% { height: 20%; opacity: 0.4; }
      100% { height: 100%; opacity: 1; }
    }

    .audio-paused span {
      animation: none !important;
      height: 4px !important;
      opacity: 0.3 !important;
    }

    /* Screen Stages */
    .screen-stage {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, 15px) scale(0.98);
      z-index: 10;
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(65px + env(safe-area-inset-top, 0px)) 20px calc(25px + env(safe-area-inset-bottom, 0px)) 20px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.5s;
    }

    .screen-stage.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0) scale(1);
    }

    /* Buttons */
    .btn-magic {
      background: linear-gradient(135deg, #ff3366, #ff6b8b);
      color: #fff;
      border: none;
      padding: 13px 30px;
      font-size: 15.5px;
      font-weight: 700;
      border-radius: 999px;
      box-shadow: 0 10px 28px var(--primary-glow);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .btn-magic:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* STAGE 1: UNWRAP */
    .gift-box-3d {
      width: 175px;
      height: 175px;
      position: relative;
      margin: 0 auto 25px auto;
      cursor: pointer;
      perspective: 1000px;
      animation: floatGift 3s ease-in-out infinite alternate;
    }

    @keyframes floatGift {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-10px) rotate(2deg); }
    }

    .gift-body {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #ffffff, #f0e6eb);
      border-radius: 26px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.45), inset 0 2px 4px rgba(255,255,255,0.9);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,0.7);
    }

    .ribbon-v {
      position: absolute;
      width: 30px;
      height: 100%;
      background: linear-gradient(90deg, #ff2a6d, #ff6584);
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .ribbon-h {
      position: absolute;
      height: 30px;
      width: 100%;
      background: linear-gradient(180deg, #ff2a6d, #ff6584);
      top: 50%;
      left: 0;
      transform: translateY(-50%);
    }

    .bow-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      background: #ff1f5a;
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(255, 31, 90, 0.5);
      z-index: 2;
    }

    .gift-tag {
      background: rgba(255,255,255,0.95);
      padding: 12px 26px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      margin-bottom: 22px;
      border: 1px solid rgba(255,255,255,0.9);
    }

    .gift-tag .sub {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      font-weight: 700;
    }

    .gift-tag .name {
      font-size: 28px;
      font-weight: 800;
      color: #1a1a2e;
      font-family: 'Playfair Display', serif;
      margin: 3px 0 1px 0;
    }

    .gift-tag .note {
      font-size: 13px;
      color: #666;
      font-style: italic;
    }

    /* STAGE 2: HEART TARGET & CUPID BOW */
    .cupid-zone {
      position: relative;
      width: 100%;
      height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      margin: 15px 0;
    }

    .heart-target {
      width: 120px;
      height: 120px;
      position: relative;
      animation: heartbeat 1.4s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 51, 102, 0.4)); }
      50% { transform: scale(1.12); filter: drop-shadow(0 0 28px rgba(255, 51, 102, 0.8)); }
    }

    .heart-target svg {
      width: 100%;
      height: 100%;
      fill: url(#heartGrad);
    }

    .bow-container {
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .bow-svg {
      width: 76px;
      height: 76px;
      filter: drop-shadow(0 4px 10px rgba(255, 209, 102, 0.5));
    }

    .arrow-flight {
      position: absolute;
      bottom: 55px;
      font-size: 32px;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      opacity: 0;
    }

    .arrow-flight.flying {
      opacity: 1;
      transform: translateY(-200px) scale(1.3);
    }

    /* STAGE 3: BANNER */
    .banner-card {
      background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 26px;
      padding: 38px 24px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .big-greet {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      line-height: 1.15;
      color: #fff;
      margin-bottom: 12px;
    }

    .big-greet span {
      background: linear-gradient(45deg, #ff3366, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
    }

    /* STAGE 4: CAKE */
    .cake-container {
      position: relative;
      width: 210px;
      height: 230px;
      margin: 20px auto;
      cursor: pointer;
    }

    .cake-tier {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #ff9ebb, #ff6584);
      border-radius: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .tier-bottom { width: 195px; height: 56px; bottom: 15px; background: #ff5e7e; }
    .tier-mid { width: 145px; height: 48px; bottom: 67px; background: #ff758f; }
    .tier-top { width: 95px; height: 44px; bottom: 112px; background: #ff8fa3; }

    .frosting {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 14px;
      background: #ffffff;
      border-radius: 14px 14px 8px 8px;
    }

    .candle {
      position: absolute;
      bottom: 156px;
      left: 50%;
      transform: translateX(-50%);
      width: 13px;
      height: 40px;
      background: repeating-linear-gradient(45deg, #ffd166, #ffd166 6px, #ffffff 6px, #ffffff 12px);
      border-radius: 5px;
    }

    .flame {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 22px;
      background: radial-gradient(circle at 50% 80%, #ffd166 0%, #ff5e00 80%);
      border-radius: 50% 50% 20% 20% / 60%
